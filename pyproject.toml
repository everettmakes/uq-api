[project]
name = "uq-api"
version = "0.1.0"
description = "A containerised REST API that returns Gaussian process predictions with uncertainty."
readme = "README.md"
authors = [
    { name = "everettmakes", email = "jeverer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "numpy>=2.5.5",
    "pymongo>=4.20.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.47.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
markers = ["perf: timing-based performance tests"]
